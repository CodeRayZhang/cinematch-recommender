name: Verify CineMatch
on:
  push:
    paths: ["frontend/**", "backend/**", "scripts/**", "docs/diagrams/**", "README.md", ".github/workflows/verify.yml"]
  pull_request:
    paths: ["frontend/**", "backend/**", "scripts/**", "docs/diagrams/**", "README.md", ".github/workflows/verify.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check architecture diagrams
        run: python3 scripts/generate_architecture.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: mvn -B -f backend/pom.xml verify
      - run: python3 scripts/import_catalog.py docs/demo-catalog.json
      - run: python3 -m unittest discover -s scripts -p "test_*.py"
